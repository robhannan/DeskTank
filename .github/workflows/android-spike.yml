# TEMPORARY (A0 spike): starts the Dream on Android TV emulators and collects
# evidence. Removed before the PR is handed off; A2 builds the real smoke test.
name: Android spike

on:
  pull_request:

permissions:
  contents: read

jobs:
  spike:
    name: spike ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [android-tv, google-tv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust toolchain and Android target
        run: |
          rustup toolchain install
          rustup target add x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk@4.1.2

      - name: Install the NDK
        run: |
          ndk=$(sed -n 's/^ndk = "\(.*\)"$/\1/p' android/gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build the x86_64 debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -Pdesktank.abis=x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the Dream on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: ${{ matrix.target }}
          arch: x86_64
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash android/spike.sh android/app/build/outputs/apk/debug/app-debug.apk spike-out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: spike-${{ matrix.target }}
          path: spike-out

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pushes to main are never cancelled: each diffs only against the commit
# before it, so a cancelled run would leave its changes untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  # Which parts of the repo this PR (or push to main, against the previous
  # commit) touches, so a docs-only change skips the builds. Jobs gate on these
  # outputs rather than `paths-ignore`, so skipped jobs report as skipped and
  # `ci-ok` below still gives one check to require.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      deny: ${{ steps.filter.outputs.deny }}
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      # Pushes are diffed with git; pull requests use the API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Changing CI itself always runs everything. Crates only some hosts link
          # (desktop platform, savers) gate just the native matrix.
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
              - .github/actions/**
            workspace: &workspace
              - *ci
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - clippy.toml
              - rustfmt.toml
              - .cargo/**
              - assets/**
            core: &core
              - *workspace
              - crates/desktank-sim/**
              - crates/desktank-render/**
            rust:
              - *workspace
              - crates/**
            deny:
              - *ci
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - .cargo/**
              - deny.toml
              - crates/*/Cargo.toml
            web:
              - *core
              - crates/desktank-web/**
              # Scenes and references the web render and save tests share.
              - crates/desktank/tests/**
              - web/**
              - tests/web/**
              # `pnpm typecheck` (run here) covers the Android tests too.
              - tests/android/**
              - tapsmith.config.ts
              - scripts/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - tsconfig.json
              - playwright.config.ts
              - .github/workflows/pages.yml
            android:
              - *core
              - crates/desktank-android/**
              - android/**
              # The Tapsmith smoke test and its dependencies.
              - tests/android/**
              - tapsmith.config.ts
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml

  check:
    name: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update apt index
        if: runner.os == 'Linux'
        run: sudo apt-get update

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libdbus-1-dev mesa-vulkan-drivers

      # Installs the toolchain pinned in rust-toolchain.toml, with rustfmt and clippy.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Docs
        run: cargo doc --workspace --no-deps --locked

      - name: CLI help
        run: cargo run --locked -q -p desktank -- --help

  deny:
    name: cargo deny
    needs: changes
    if: needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The action's container reads rust-toolchain.toml and installs the pinned
      # toolchain on each run (a "not installed" log line first is expected).
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same build as the Pages deploy, so a broken demo fails the PR.
      - uses: ./.github/actions/build-web

      # Strict tsc over the scripts, tests and page (after the build, which
      # writes wasm-bindgen's declarations).
      - name: Typecheck
        run: pnpm typecheck

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Smoke test (WebGL2 and the default backend), context-loss recovery and
      # the WebGL2 render comparison with the native reference (SPEC §7).
      - name: Web tests
        run: pnpm test:web

      - name: Clippy (wasm32)
        run: cargo clippy -p desktank-web --target wasm32-unknown-unknown --locked -- -D warnings

      # The renderer must build for the web and stay within WebGL2 (SPEC §3.5).
      - name: Clippy desktank-render (wasm32)
        run: cargo clippy -p desktank-render --target wasm32-unknown-unknown --locked -- -D warnings

  # The Android host (SPEC §3.6, §7): libdesktank_android.so for every ABI
  # with cargo-ndk, packaged into the debug APK by Gradle, then the A2 smoke
  # test on an Android TV emulator with Tapsmith (tests/android/).
  android:
    name: android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust toolchain and Android targets
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk@4.1.2

      # The exact NDK pinned in the version catalogue, which AGP also uses.
      - name: Install the NDK
        run: |
          ndk=$(sed -n 's/^ndk = "\(.*\)"$/\1/p' android/gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"

      # The JNI glue only compiles for Android, so desktop clippy never sees it.
      - name: Clippy (Android)
        run: |
          cargo clippy -p desktank-android --target aarch64-linux-android --locked -- -D warnings
          cargo clippy -p desktank-android --target armv7-linux-androideabi --locked -- -D warnings

      # Validates the committed wrapper jar against Gradle's checksums.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: APK contents
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep -E 'lib/|classes'
          ls -l "$apk"
          # 16 KB page alignment for the 64-bit ABIs (Android 15+ devices with
          # 16 KB pages; the rule doesn't cover armeabi-v7a).
          readelf="$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          for abi in arm64-v8a armeabi-v7a x86_64; do
            so=android/app/build/rustJniLibs/$abi/libdesktank_android.so
            echo "$so"; "$readelf" -lW "$so" | grep LOAD
          done
          for abi in arm64-v8a x86_64; do
            so=android/app/build/rustJniLibs/$abi/libdesktank_android.so
            if "$readelf" -lW "$so" | grep LOAD | grep -qv ' 0x4000$'; then
              echo "::error::$so has LOAD segments not aligned to 16 KB"; exit 1
            fi
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktank-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Installs the pnpm version from package.json's packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - name: Install pnpm dependencies (Tapsmith)
        run: pnpm install --frozen-lockfile

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The A0 spike's recipe (PROGRESS): the API 36 Android TV image at
      # 1080p on SwiftShader. Tapsmith installs the APK (its x86_64 library)
      # and the test starts the Dream, checks the frame and logcat, and ends it.
      - name: Smoke test the Dream on the Android TV emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          TAPSMITH_TELEMETRY: "0"
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: pnpm test:android

      # Screenshots, the Dream's frame and logcat, and a trace on failure.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-smoke-test
          path: |
            tapsmith-results/
            tapsmith-report/
          if-no-files-found: ignore
          retention-days: 14

  # The one check to require: passes when every job above passed or was
  # skipped as irrelevant, fails if any failed or was cancelled.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, check, deny, web, android]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A CI job finished as $r"; exit 1 ;;
            esac
          done

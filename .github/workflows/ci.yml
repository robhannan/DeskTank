name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update apt index
        if: runner.os == 'Linux'
        run: sudo apt-get update

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libdbus-1-dev mesa-vulkan-drivers

      # Installs the toolchain pinned in rust-toolchain.toml, with rustfmt and clippy.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Docs
        run: cargo doc --workspace --no-deps --locked

      - name: CLI help
        run: cargo run --locked -q -p desktank -- --help

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The action's container reads rust-toolchain.toml and installs the pinned
      # toolchain on each run (a "not installed" log line first is expected).
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same build as the Pages deploy, so a broken demo fails the PR.
      - uses: ./.github/actions/build-web

      # Strict tsc over the scripts, tests and page (after the build, which
      # writes wasm-bindgen's declarations).
      - name: Typecheck
        run: pnpm typecheck

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Smoke test (WebGL2 and the default backend), context-loss recovery and
      # the WebGL2 render comparison with the native reference (SPEC §7).
      - name: Web tests
        run: pnpm test:web

      - name: Clippy (wasm32)
        run: cargo clippy -p desktank-web --target wasm32-unknown-unknown --locked -- -D warnings

      # The renderer must build for the web and stay within WebGL2 (SPEC §3.5).
      - name: Clippy desktank-render (wasm32)
        run: cargo clippy -p desktank-render --target wasm32-unknown-unknown --locked -- -D warnings

  # The Android host (SPEC §3.6, §7): libdesktank_android.so for every ABI
  # with cargo-ndk, packaged into the debug APK by Gradle.
  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust toolchain and Android targets
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk@4.1.2

      # The exact NDK pinned in the version catalogue, which AGP also uses.
      - name: Install the NDK
        run: |
          ndk=$(sed -n 's/^ndk = "\(.*\)"$/\1/p' android/gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"

      # The JNI glue only compiles for Android, so desktop clippy never sees it.
      - name: Clippy (Android)
        run: |
          cargo clippy -p desktank-android --target aarch64-linux-android --locked -- -D warnings
          cargo clippy -p desktank-android --target armv7-linux-androideabi --locked -- -D warnings

      # Validates the committed wrapper jar against Gradle's checksums.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: APK contents
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep -E 'lib/|classes'
          ls -l "$apk"
          # 16 KB page alignment for the 64-bit ABIs (Android 15+ devices with
          # 16 KB pages; the rule doesn't cover armeabi-v7a).
          readelf="$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          for abi in arm64-v8a armeabi-v7a x86_64; do
            so=android/app/build/rustJniLibs/$abi/libdesktank_android.so
            echo "$so"; "$readelf" -lW "$so" | grep LOAD
          done
          for abi in arm64-v8a x86_64; do
            so=android/app/build/rustJniLibs/$abi/libdesktank_android.so
            if "$readelf" -lW "$so" | grep LOAD | grep -qv ' 0x4000$'; then
              echo "::error::$so has LOAD segments not aligned to 16 KB"; exit 1
            fi
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktank-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

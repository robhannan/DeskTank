[package]
name = "desktank-web"
description = "DeskTank web host: drives desktank-render's Tank on a canvas through wgpu (WebGPU or WebGL2), via wasm-bindgen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib for wasm-bindgen; rlib so native tests and docs build.
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
desktank-sim.workspace = true
desktank-render.workspace = true

# Only the wasm build links the browser bindings, so native workspace builds
# stay unchanged. wasm-bindgen is pinned exactly: the wasm-bindgen CLI must
# match this version (CI reads it from Cargo.lock; scripts/build-web.ts
# checks).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.130", default-features = false, features = ["std"] }
wasm-bindgen-futures = { version = "0.4.80", default-features = false, features = ["std"] }
web-sys = { version = "0.3.107", default-features = false, features = ["std", "HtmlCanvasElement", "console"] }

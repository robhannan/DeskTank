# D28, #369: the film varieties side by side. Brown diatoms (left) cover sand,
# stone, wood and glass; green spot algae (middle) form hard round spots on
# stone, wood and glass, and green dust algae (right) a dusty layer there.
# The films are placed, not grown: in play algae only grows by itself.

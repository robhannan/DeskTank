# Shrimp and crabs: cherry and amano shrimp walking and hopping over an
# aquasoil bed and grazing an algae film, and Thai micro crabs clinging to
# the plants and rock and walking the bed. Grown for 6 minutes first.
ticks = 7600

[world]
water_level = 0.92

# The bed: overlapping discs along the floor.

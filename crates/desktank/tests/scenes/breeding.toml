# Breeding and colour genetics (T9 part 2): cherry shrimp in each morph
# (red, the brown wildtype, blue, yellow) along the bed, each as a small
# slim male, a larger female and a berried female with yellow-orange eggs
# (issue #315); guppies in pairs, the long-tailed male above the larger,
# plainer, deeper, short-tailed female, in the wild, red and blue strains;
# a corydoras pair that settles in for a day of its life (10 minutes) and
# then lays a clutch of cream eggs on the bed beside it; betta pairs near
# the surface, the long-finned male beside the smaller, short-finned hen,
# in the wild, royal blue and copper morphs; and a honey gourami pair, the
# golden male above the larger, silvery hen.

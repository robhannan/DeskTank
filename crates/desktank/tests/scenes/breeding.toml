# Breeding and colour genetics (T9 part 2): cherry shrimp in each morph
# (red, the brown wildtype, blue, yellow) along the bed; guppies in pairs,
# the long-tailed male above the plainer, deeper, short-tailed female, in
# the wild, red and blue strains; and a corydoras pair that settles in for
# a day of its life (10 minutes) and then lays a clutch of cream eggs on
# the bed beside it.

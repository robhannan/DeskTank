# Epiphytes, layered mats and branching/trailing stems (T6c part 3):
# anubias on glued rock, java fern on glued driftwood, layered christmas
# moss on glued rock, and branching rotala plus surface-trailing cabomba,
# grown for 15 minutes.
ticks = 21600

[world]
water_level = 0.62

[[pour]]
repeat = 42
x = 0
y = 96
dx = 4
radius = 15
material = "aquasoil"
brush = "replace"

# Rock on the left for anubias.

# Plant species side by side (T6d): the five stem plants (rotala,
# hygrophila, ludwigia, cabomba and bacopa) in an aquasoil bed, and java
# moss and christmas moss on two glued rocks, grown for 8 minutes, so each
# species' shapes and colour ramp are checked against the others.
ticks = 9600

[world]
water_level = 0.92

[[pour]]
repeat = 42
x = 0
y = 98
dx = 4
radius = 15
material = "aquasoil"
brush = "replace"

[[pour]]
x = 12
y = 20
radius = 0
plant = "rotala"

[[pour]]
x = 33
y = 20
radius = 0
plant = "hygrophila"

[[pour]]
x = 54
y = 20
radius = 0
plant = "ludwigia"

[[pour]]
x = 76
y = 20
radius = 0
plant = "cabomba"

[[pour]]
x = 98
y = 20
radius = 0
plant = "bacopa"

[[pour]]
x = 122
y = 72
radius = 8
material = "rock"
brush = "replace"
glued = true

[[pour]]
x = 122
y = 72
radius = 10
plant = "java_moss"

[[pour]]
x = 147
y = 72
radius = 8
material = "rock"
brush = "replace"
glued = true

[[pour]]
x = 147
y = 72
radius = 10
plant = "christmas_moss"

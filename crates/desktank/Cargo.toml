[package]
name = "desktank"
description = "DeskTank: a lightweight pixel-art aquarium for your desktop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap.workspace = true
desktank-platform.workspace = true
desktank-render.workspace = true
desktank-sim.workspace = true
interprocess = { version = "2.4.9", default-features = false }
notify = { version = "9", default-features = false }
png = "0.18.1"
pollster = "1.0.2"
serde = { version = "1", default-features = false, features = ["derive", "std"] }
thiserror = "2"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# Default features minus the Adwaita client-side decorations on Wayland (they
# pull in a font rasteriser); winit falls back to its plain frame there.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "9", default-features = false, features = ["macos_fsevent"] }

[lints]
workspace = true

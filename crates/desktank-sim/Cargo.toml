[package]
name = "desktank-sim"
description = "DeskTank simulation: grid, materials, creatures and ecosystem. No GPU, no OS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
crc32fast = { version = "1.5.5", default-features = false }
lz4_flex = { version = "0.14.2", default-features = false, features = ["alloc", "safe-encode", "safe-decode", "checked-decode"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rand_core = { version = "0.10", default-features = false }
rand_pcg = { version = "0.10", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
thiserror = "2"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "tick"
harness = false

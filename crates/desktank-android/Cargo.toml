[package]
name = "desktank-android"
description = "DeskTank Android host: libdesktank_android.so, driven over JNI by the Kotlin shim in android/ (SPEC §3.6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# libdesktank_android.so, loaded by the Kotlin shim with
# System.loadLibrary("desktank_android"). Not "desktank": that would collide
# with the desktank binary's docs (cargo#6313).
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
desktank-sim.workspace = true
desktank-render.workspace = true

# Only the Android build links JNI and the NDK, so desktop workspace builds
# compile the OS-agnostic parts (and their tests) and nothing else.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false }
ndk = { version = "0.9.0", default-features = false, features = ["nativewindow", "rwh_06"] }
ndk-sys = { version = "0.6.0", default-features = false }
# `debug.desktank.backend`, to force a wgpu backend for testing.
android_system_properties = { version = "0.1.6", default-features = false }
pollster = "1.0.2"
# The Android display handle wgpu needs to create surfaces.
raw-window-handle = { version = "0.6.2", default-features = false }

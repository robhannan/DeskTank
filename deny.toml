# cargo-deny configuration: `cargo deny check` runs in CI (SPEC §7).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# In cargo-deny's v2 config, vulnerability and unsound advisories always fail;
# unmaintained ones fail for every crate in the graph (set explicitly below).
# Ignore entries need an advisory ID and a reason.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licences compatible with shipping DeskTank as MIT OR Apache-2.0.
# Copyleft licences (GPL, LGPL, MPL, …) are deliberately absent.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The list anticipates future dependencies; don't warn about unused entries.
unused-allowed-license = "allow"

# BSD Zero Clause is permissive. Interprocess uses these two support crates.
exceptions = [
    { allow = ["0BSD"], crate = "doctest-file" },
    { allow = ["0BSD"], crate = "recvmsg" },
]

[licenses.private]
# Workspace crates are `publish = false` and carry the repository licence.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies have no version; allowed because nothing is published.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

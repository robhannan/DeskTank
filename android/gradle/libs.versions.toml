# Versions for the Android build, pinned exactly (SPEC §5).
[versions]
# Android Gradle Plugin. It builds Kotlin itself (AGP 9's built-in Kotlin).
agp = "9.5.2"
# Kotlin Gradle Plugin on the build classpath, overriding the older one AGP
# brings (2.2.10).
kotlin = "2.4.21"
# The NDK cargo-ndk links libdesktank_android.so with and AGP strips it with.
# CI installs this exact version.
ndk = "30.0.16248370"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

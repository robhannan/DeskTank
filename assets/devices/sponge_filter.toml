# Sponge filter (docs/spec/devices.md §2.8, D27, DV4): a black vertically
# fluted cylindrical foam sponge on a smooth dark circular weighted base,
# topped with a glossy black collar and a frosted-clear cylindrical uplift
# tube. Sits on the bed (drops like the bubbler), emits rising bubbles from
# the tube mouth, drives gentle upward uplift flow, is intrinsically fry-safe,
# and invites shrimp to graze its porous foam.
name = "sponge_filter"
label = "Sponge filter"
# Where it may go: dropped straight down onto the substrate, hardscape or floor.
mount = "bed"
# The uplift tube mouth, in cells from the art's top-left, jetting straight up.
nozzle = [7, 0]
nozzle_dir = [0.0, -1.0]
# Gentle air-driven uplift flow relative to the internal power filter.
flow_scale = 0.45
# Bubble outlet cells across the top mouth of the uplift tube, and clean emission
# rate in bubbles per second per cell (scales with media flow factor).
bubble_outlets = [[6, 0], [7, 0], [8, 0]]
bubble_rate = 1.1
# Intake cells along both flanks of the foam sponge body.
intakes = [[0, 12], [0, 18], [14, 12], [14, 18]]
# Always safe for fry and small shrimp without an intake guard.
fry_safe = true
# Rows of the foam sponge body that shrimp seek out and graze (inclusive).
graze_rows = [8, 23]

[sprite]
# Symmetric front-on bed mount; two texels per cell side: 15x26 cells (30x52).
# Traced from the owner's reference photo: a black vertically ribbed/fluted
# cylindrical foam sponge on a slightly narrower smooth glossy circular base,
# a glossy circular collar flange on top, and a tall frosted-clear acrylic
# uplift tube rising from the centre. House shading (D19): dark local-colour
# outlines (never pure black), porous reticulated foam dithering, glossy
# bevel highlights on collar and base, and cool frosted highlights on the tube.

# Hang-on-back (HOB) filter (docs/spec/devices.md §2.8, D27, DV5): a smoked
# charcoal boxy housing hanging on the top rim partly above the water line,
# with a wide ribbed spillway lip pouring a waterfall into the surface and a
# dark matte intake tube dropping down in the back depth band to a slotted
# strainer basket.
name = "hob_filter"
label = "HOB filter"
# Where it may go: hanging on the top rim, partly above the water line.
mount = "rim"
# The waterfall outlet centre at the spillway lip, jetting downwards and
# slightly away from the intake tube so water circulates across the tank.
nozzle = [7, 9]
nozzle_dir = [-0.25, 0.97]
# Strong waterfall turnover relative to the internal power filter.
flow_scale = 0.85
# Intake cells along both flanks of the bottom slotted strainer basket.
intakes = [[14, 26], [14, 29], [19, 26], [19, 29]]
# Rows from this local row downwards (the intake tube and strainer) occupy
# the back depth band (D21), so fish swim and render in front of them while
# the upper rim-mounted body stays solid in every band.
back_band_from = 10
# Waterfall spillway span [x0, x1, y] (inclusive local columns and lip row,
# facing right) that drives the waterfall curtain and surface ripples.
spillway = [1, 12, 9]

[sprite]
# Rim-mounted front view (facing right: waterfall spillway on the left,
# intake tube and flow-control dial on the right; mirrors cleanly when
# flipped); two texels per cell side: 22x32 cells (44x64). Traced from the
# owner's reference photo of a smoked-charcoal HOB filter: rounded translucent
# vented lid, dark ribbed internal weir chamber, projecting waterfall
# spillway lip, circular flow-control dial knob, matte charcoal intake tube
# with telescopic collar, and a slotted bottom strainer basket. House shading
# (D19): dark cool-charcoal outlines (never pure black), smoked-plastic bevel
# highlights, cylindrical pipe shading, and frothy aqua/white spillway edge.
colours = { o = "#11151b", k = "#0c1015", d = "#1a1f27", b = "#272e38", m = "#39424f", g = "#515d6e", h = "#78879b", s = "#aebccb", p = "#1f252e", q = "#465160", a = "#4a7f9e", c = "#8bc7e0", w = "#e4f6ff" }

# Under-gravel filter (docs/spec/devices.md §2.8, D27, DV6): interlocking
# dark charcoal-slate slotted plates laid across the tank floor under the
# substrate, with a frosted-clear vertical uplift tube rising from a flared
# frosted-white collar in the back-left corner, a royal-blue air stone glowing
# in the lower tube, and a short flared clear spout bending over the top.
# Floor-mounted (goes under the gravel bed), drives gentle air-lift flow that
# pulls water down through the gravel and up the tube, and is intrinsically
# fry-safe.
name = "under_gravel_filter"
label = "Under-gravel filter"
# Where it may go: a plate on the tank floor, under any substrate already there.
mount = "floor"
# The spout tip, in cells from the art's top-left, jetting sideways (right).
nozzle = [6, 2]
nozzle_dir = [1.0, 0.0]
# Gentle air-lift flow relative to the internal power filter.
flow_scale = 0.65
# Bubbles from the air stone surface out of the spout mouth, with open water
# directly above, at a gentle rate (bubbles per second per cell).
bubble_outlets = [[5, 1], [6, 1]]
bubble_rate = 0.9
# Intake cells spaced along the top row of the slotted plate (clear of the
# uplift tube and collar), drawing water down through the gravel.
intakes = [[8, 25], [12, 25], [16, 25], [20, 25], [25, 25]]
# Always safe for fry and small shrimp without an intake guard.
fry_safe = true

[sprite]
# Facing right (uplift tube and spout on the left; mirrors when flipped); two
# texels per cell side: 28x28 cells (56x56). Traced from the owner's reference
# photo: slotted charcoal plates with comb slots along the front edge, a
# flared frosted-white collar, a graduated frosted-clear tube with a royal-blue
# air stone inside its lower section, and a short flared clear outlet spout at
# the top. House shading (D19): dark local-colour outlines (never pure black),
# dithered frosted-glass light/shade bands, plate bevel highlights and slots.

# Internal power filter (SPEC §2.8, D27, DV1): a tall box suction-cupped to
# the side glass at any height, with intake slots on its lower body and a
# nozzle near the top that jets sideways into the tank.
name = "internal_filter"
label = "Internal filter"
# Where it may go: on the side glass, at any height under the water line.
mount = "side_glass"
# The nozzle tip, in cells from the art's top-left (facing right): the jet
# starts here and points away from the glass (`assets/fields.toml`,
# [current]).
nozzle = [13, 8]

[sprite]
# Mounted on the left glass, jetting right (mirrored on the right glass);
# two texels per cell side: 14x30 cells. Traced from the owner's reference
# photo of a black internal power filter (mirrored, so its suction cups
# face the glass): a box about three times as tall as wide with a rounded
# top on the tank side; a motor head with a seam ridge near the glass and a
# +/− flow slider; two media modules below, each with three diagonal
# blue-tinted slot vents rising towards the glass and a clip mark, and a
# darker vented column on the tank side; two suction-cup knobs on the
# glass side; a ribbed nozzle collar and spout near the top. House shading:
# an outline in a dark shade of the plastic (never black), a dithered sheen
# strip down the glass side, a lit top and seam lips, and a dithered turn
# into shadow towards the tank side and the bottom.
colours = { o = "#15181d", k = "#0b0d10", b = "#2a2e35", d = "#1e2127", h = "#444b56", s = "#8f9aa8", n = "#2a2e35", c = "#2a2e35", w = "#e6f4ff", B = "#2f56b0", L = "#6f95e0", D = "#1d3170" }

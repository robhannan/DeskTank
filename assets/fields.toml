# Fields and devices (SPEC §2.1, T5). Our own invented values. Fields are
# 1/8 of the cell resolution and step every 4th tick (0.2 s).
# Diffusion is in cells² per second (at most 80), decay per second.

[nutrient]
diffusion = 16.0
decay = 0.0

[co2]
diffusion = 24.0
# Outgassing at the surface, spread over the whole tank.
decay = 0.01

# Light is not diffused: each field cell gets the light left after the
# field cells above it. `water` is the fraction a field cell of water
# absorbs, `opaque` the fraction a field cell full of solids, substrate or
# food blocks (scaled by how full it is).
[light]
surface = 1.0
water = 0.04
opaque = 0.9

# The 2D current field (D27, DV2): directed jets start at `speed` cells per
# second at the nozzle, fading over `reach` cells and widening by one field
# row on each side every `spread` field cells. Intakes draw water radially
# inwards at up to `intake_speed` cells per second over `intake_reach` cells.
[current]
material = "filter_outlet"
speed = 10.0
reach = 160
spread = 4
intake_speed = 4.0
intake_reach = 32
# Minimum 2D current speed (cells/s) at the water surface that disrupts and
# ripples the water line; slower currents keep the surface calm.
surface_ripple_speed = 1.0

# The bubbler releases `emits` from each top cell with water above, at
# `rate` per second per cell.
[bubbler]
material = "bubbler"
emits = "air_bubble"
rate = 0.7

# The water change (T6, a tray action): replaces `fraction` of the water,
# so the nutrient and CO₂ fields lose that fraction, and siphons these
# materials out of the tank.
[water_change]
fraction = 0.5
siphon = ["waste", "detritus", "dead_plant", "sinking_pellet", "bloodworm", "algae_wafer"]

# The water-quality score (T6, SPEC §2.3), from 0 (foul) to 1 (pristine).
# It loses up to `nutrient_weight` as the mean nutrient level in the water
# rises from `nutrient_ok` to `nutrient_bad`, and up to `pollution_weight`
# as pollutants reach `pollution_bad` cells per 1000 water cells; plants
# add up to `plant_bonus` (reached at `plant_full` plant cells per 1000;
# plant cells are counted from the plant table, T6b).
# `algae` is the material whose cover of the substrate is reported.
[quality]
nutrient_ok = 0.5
nutrient_bad = 1.5
nutrient_weight = 0.6
pollutants = ["waste", "detritus", "dead_plant"]
pollution_bad = 20.0
pollution_weight = 0.4
plant_full = 20.0
plant_bonus = 0.2
filter_bonus = 0.15
algae = "algae"

# Mechanical and biological filtration (D27, DV3): intakes capture these
# suspended materials into media load (reaching 100% after `capacity` cells),
# flow falls with load down to `clog_floor` (never below ~30%), media
# matures over `maturity_days` life-days, and a mature filter speeds up
# pollutant breakdown by up to `waste_boost` (1 + waste_boost at full bio).
[filtration]
capture = ["flake_food", "sinking_pellet", "bloodworm", "algae_wafer", "waste", "detritus", "dead_plant", "algae"]
capacity = 200.0
clog_floor = 0.3
maturity_days = 7.0
waste_boost = 2.0

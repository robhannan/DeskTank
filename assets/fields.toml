# Fields and devices (SPEC §2.1, T5). Our own invented values. Fields are
# 1/8 of the cell resolution and step every 4th tick (0.2 s).
# Diffusion is in cells² per second (at most 80), decay per second.

[nutrient]
diffusion = 16.0
decay = 0.0

[co2]
diffusion = 24.0
# Outgassing at the surface, spread over the whole tank.
decay = 0.01

# Light is not diffused: each field cell gets the light left after the
# field cells above it. `water` is the fraction a field cell of water
# absorbs, `opaque` the fraction a field cell full of solids, substrate or
# food blocks (scaled by how full it is).
[light]
surface = 1.0
water = 0.04
opaque = 0.9

# The 2D current field (D27, DV2): directed jets start at `speed` cells per
# second at the nozzle, fading over `reach` cells and widening by one field
# row on each side every `spread` field cells. Intakes draw water radially
# inwards at up to `intake_speed` cells per second over `intake_reach` cells.
[current]
material = "filter_outlet"
speed = 10.0
reach = 160
spread = 4
intake_speed = 4.0
intake_reach = 32
# Minimum 2D current speed (cells/s) at the water surface that disrupts and
# ripples the water line; slower currents keep the surface calm.
surface_ripple_speed = 1.0

# The bubbler releases `emits` from each top cell with water above, at
# `rate` per second per cell.
[bubbler]
material = "bubbler"
emits = "air_bubble"
rate = 0.7

# The water change (T6, a tray action): replaces `fraction` of the water,
# so the nutrient and CO₂ fields lose that fraction, and siphons these
# materials out of the tank.
[water_change]
fraction = 0.5
siphon = ["waste", "detritus", "dead_plant", "sinking_pellet", "bloodworm", "algae_wafer"]

# The water-quality score (T6, SPEC §2.3), from 0 (foul) to 1 (pristine).
# It loses up to `nutrient_weight` as the mean nutrient level in the water
# rises from `nutrient_ok` to `nutrient_bad`, and up to `pollution_weight`
# as pollutants reach `pollution_bad` cells per 1000 water cells; plants
# add up to `plant_bonus` (reached at `plant_full` plant cells per 1000;
# plant cells are counted from the plant table, T6b).
[quality]
nutrient_ok = 0.5
nutrient_bad = 1.5
nutrient_weight = 0.6
pollutants = ["waste", "detritus", "dead_plant"]
pollution_bad = 20.0
pollution_weight = 0.4
plant_full = 20.0
plant_bonus = 0.2
filter_bonus = 0.15

# Mechanical and biological filtration (D27, DV3): intakes capture these
# suspended materials into media load (reaching 100% after `capacity` cells),
# flow falls with load down to `clog_floor` (never below ~30%), media
# matures over `maturity_days` life-days, and a mature filter speeds up
# pollutant breakdown by up to `waste_boost` (1 + waste_boost at full bio).
[filtration]
capture = ["flake_food", "sinking_pellet", "bloodworm", "algae_wafer", "waste", "detritus", "dead_plant"]
capacity = 200.0
clog_floor = 0.3
maturity_days = 7.0
waste_boost = 2.0

# Natural surface film (D28, #369). Rates are density levels per world
# second, from 0 (bare) to 15 (full density). Front glass stops at 5.
# `nutrient`, `light` and the four rates are the defaults a variety
# inherits; `co2_boost` is the plant competition's CO₂ term.
[algae]
substrate = ["sand", "gravel", "clown_vomit_gravel", "aquasoil"]
hardscape = ["rock", "driftwood"]
nutrient = 0.6
light = 0.15
seed_rate = 0.012
creep_rate = 0.075
growth_rate = 0.15
die_back_rate = 0.06
# Plants with CO₂ to work with outcompete film sooner: the plant competition
# in a block is multiplied by 1 + co2_boost × the block's CO₂ level.
co2_boost = 0.5

# Varieties. Algae only spawns naturally, never from the palette.
#
# id          the coat byte's high nibble (1..=15)
# priority    where several varieties would grow, the highest wins; a coated
#             cell keeps its variety until it has died back to bare
# hosts       substrate, hardscape, front_glass, rear_glass
# nutrient, light, co2, maturity
#             the conditions it grows in, from the block's fields and the
#             filters' biological maturity (0 = none or new, 1 = cycled):
#             above `min` and at most `max`. Outside them (or with the
#             nutrient missing) its coat recedes; where only the
#             light is below `min` it neither grows nor recedes. The light
#             and nutrient `min` default to the [algae] values above.
# seed_rate, creep_rate, growth_rate, die_back_rate
#             override the [algae] defaults
# resistance  percent a grazer with no taste for it can't graze
#             (a species' own [grazing] entry overrides it)
# look        style (film, slime, spots, dust), the thin (`dark`) and thick
#             (`light`) shades, and the opacity of the thickest coat
#
# The conditions stand in for the causes in the Green Aqua algae guide; the
# table is in docs/spec/world.md §2.3.

# The generic green film: any host, any water with nutrient and light.
[[algae.variety]]
id = 1
name = "green_film"
priority = 10
hosts = ["substrate", "hardscape", "front_glass", "rear_glass"]
resistance = 0
look = { style = "film", dark = "#4a6621", light = "#8ca345", strength = 0.7 }

# Brown diatoms: a slimy film of a new tank (rich in ammonia and silicates)
# and dim light. It recedes as the filter matures. Otocinclus rasp it off
# quickly.
[[algae.variety]]
id = 2
name = "diatoms"
priority = 35
hosts = ["substrate", "hardscape", "front_glass", "rear_glass"]
nutrient = { min = 0.9 }
light = { max = 0.68 }
maturity = { max = 0.5 }
seed_rate = 0.016
creep_rate = 0.08
resistance = 0
look = { style = "slime", dark = "#7b5324", light = "#cf9f52", strength = 0.8 }

# Green spot algae: hard round spots on glass and hardscape under strong
# light with little CO₂ (a stand-in for low phosphate). Slow, and stuck on:
# only a nerite rasps a little off.
[[algae.variety]]
id = 3
name = "green_spot"
priority = 40
hosts = ["hardscape", "front_glass", "rear_glass"]
light = { min = 0.68 }
co2 = { max = 0.3 }
seed_rate = 0.006
creep_rate = 0.02
growth_rate = 0.03
die_back_rate = 0.02
resistance = 100
look = { style = "spots", dark = "#3f8a2f", light = "#a8e262", strength = 0.95 }

# Green dust algae: a dusty layer on glass and hardscape (never substrate)
# at low CO₂ with moderate nutrients (a leaner tank than diatoms favour),
# most often in a young or low-tech tank. Scraping only spreads it; almost
# nothing grazes it.
[[algae.variety]]
id = 4
name = "green_dust"
priority = 30
hosts = ["hardscape", "front_glass", "rear_glass"]
nutrient = { max = 0.9 }
light = { min = 0.3 }
co2 = { max = 0.3 }
maturity = { max = 0.8 }
seed_rate = 0.01
creep_rate = 0.05
growth_rate = 0.08
die_back_rate = 0.04
resistance = 90
look = { style = "dust", dark = "#5a9448", light = "#b3dc7c", strength = 0.85 }

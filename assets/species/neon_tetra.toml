# A small schooling tetra, Paracheirodon innesi: keeps to mid-water and
# takes flakes and bloodworms.
id = 1
name = "neon_tetra"
scientific_name = "Paracheirodon innesi"
description = "A small schooling fish with a bright blue stripe and a red tail stripe."
palette = "fish/schooling"
zone = "mid"
# The band of the water column it keeps to: 0 is the surface, 1 the floor.
depth = [0.25, 0.7]
# Water depth it needs, in cells; the tank warns below it.
min_depth = 24
# Real-world body length in cm, at two cells per cm.
length_cm = 3.5
# Lifespan and age at maturity in real days (5 years in an aquarium; mature
# at about 6 months), on the life clock: a day per 10 world minutes
# (LIFE_DAY_SECONDS).
lifespan_days = 1825
maturity_days = 180
breathes_air = false
temperament = "schooling"
# Cells per second: cruising, and darting after food.
speed = 5.0
max_speed = 10.0
diet = ["flake_food", "bloodworm"]

# Egg scatterer: eggs hatch in about a day (real clutches of 60–130).
# Broods are scaled down for a desktop tank; days are on the life clock.
[breeding]
mode = "eggs"
days = 1
brood = [6, 12]
rest_days = 14

# Sprite: 7x3 cells (14x6 texels, 28x12 fine), facing right, traced from the
# owner's photo of a neon tetra: an olive-silver back, an electric blue-cyan
# iridescent stripe from the eye past the dorsal fin, a crimson-red lower
# posterior half tapering diagonally into a silvery-white belly, translucent
# swept dorsal and anal fins, a symmetrical forked tail, and a cyan-ringed
# eye. The four frames are rest, the tail sweeping in and lifting, rest, and
# sweeping in and dropping, with the dorsal and anal fins rippling and
# glints drifting along the iridescent stripe.
[sprite]
colours = { d = "#728680", h = "#9cb0a8", x = "#4e625e", b = "#0e8cff", u = "#1be6ff", c = "#aef8ff", r = "#eb1c24", p = "#ef5244", R = "#a2121c", w = "#e6eff4", W = "#c4d4de", g = "#8da2b0", a = "#6f8492", f = "#a6bac2", s = "#748a94", l = "#cadbe2", I = "#3ae6ff", k = "#0c1016", e = "#ffffff" }

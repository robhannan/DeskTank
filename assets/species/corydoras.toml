# A bottom-dwelling catfish, drawn as a julii-type cory: keeps to the floor
# and grazes surface films and mulm and takes food that sinks.
id = 2
name = "corydoras"
scientific_name = "Corydoras trilineatus"
description = "A patterned catfish that searches the bottom with its barbels."
palette = "fish/cleanup"
zone = "bottom"
depth = [0.72, 1.0]
min_depth = 20
# Real-world body length in cm, at two cells per cm.
length_cm = 4.0
# Lifespan and age at maturity in real days (5 years (often longer); mature
# at about 9 months), on the life clock: a day per 10 world minutes
# (LIFE_DAY_SECONDS).
lifespan_days = 1825
maturity_days = 270
breathes_air = false
temperament = "shoaling"
speed = 3.5
max_speed = 7.0
# Would rather stay on the bottom, but lifts off for a short swim now and then.
swim_every = 36.0
diet = ["sinking_pellet", "algae_wafer", "bloodworm", "flake_food", "algae", "detritus"]

# Sticks its eggs to glass and leaves; they hatch in 3–5 days.
# Broods are scaled down for a desktop tank; days are on the life clock.
[breeding]
mode = "eggs"
days = 4
brood = [4, 10]
rest_days = 14

# Sprite: 8x4 cells (16x8 texels, 32x16 fine), its outline traced from the
# owner's photo of a cory and its colours from their julii-type photo: an
# off-white body with dark spots, a dark stripe along the side from the
# tail forward, a silvery belly, a black blotch on the dorsal tip, a
# spotted tail, a gold-ringed eye and short barbels. The four frames are
# rest, the tail sweeping in and lifting, rest, and sweeping in and
# dropping, with the dorsal and paired fins rippling and the barbels
# swaying.
[sprite]
colours = { b = "#e4ded0", h = "#f4f0e6", x = "#8c8474", s = "#3a322c", w = "#f2f2ee", a = "#a8a8a0", f = "#dcd8cc", R = "#b4ad9c", r = "#2e2826", l = "#d8d2c4", I = "#d8b860", k = "#0c1016", e = "#ffffff" }

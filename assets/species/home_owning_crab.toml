# The home owning crab (placeholder art, D11): the medical crab in
# gardening clothes (sun hat, head scarf, a gloved claw), spawned by the
# cheat `home owner!`. Soon after it arrives it picks a home on the
# substrate, plants a small patch of dwarf hairgrass there and keeps near
# it. Peaceful, eats anything that isn't alive, and very stinky.
id = 13
name = "home_owning_crab"
scientific_name = "Decapodus zoidbergii dominus"
description = "A gardening crab that plants a patch of dwarf hairgrass for its home."
zone = "bottom"
depth = [0.7, 1.0]
min_depth = 18
# Real-world body length in cm (the carapace; the claws and legs are drawn
# past it), at two cells per cm.
length_cm = 3.0
# Lifespan and age at maturity in real days (about 10 years; mature at a
# year), on the life clock: a day per 10 world minutes (LIFE_DAY_SECONDS).
lifespan_days = 3650
maturity_days = 365
temperament = "peaceful"
speed = 2.0
max_speed = 5.0
# The claws pick food from two cells away.
reach = 2
# Diet: everything edible in `assets/materials` that isn't alive: every
# food (flake_food, sinking_pellet, bloodworm, algae_wafer), algae, mulm
# (detritus) and dead plant matter, plus corpses (`eats_corpses`). Left
# out: live plant parts, seeds and cuttings (it would eat its own carpet),
# root tabs and liquid fertiliser (not food), and waste, which it would
# otherwise eat straight back and so cancel its own bioload.
diet = ["flake_food", "sinking_pellet", "bloodworm", "algae_wafer", "algae", "detritus", "dead_plant"]
eats_corpses = true
# Very stinky: a dropping of waste every 4 seconds (15 a minute), where
# every stocked species leaves none.
waste_every = 4.0
# The carpet it plants at its home: a few plantlets, once.
home_carpet = "dwarf_hairgrass"
# Added only by its cheat (SPEC §2.5): not in the palette, `spawn` or
# stocking, and it never breeds.
cheat_only = true


# A honey gourami, Trichogaster chuna (placeholder art, D11): a small,
# gentle labyrinth fish of the upper and middle water, the male drawn in
# breeding colour (bright honey gold with a dark speckled throat). It
# rises to gulp air at the surface like the betta, but swims slower and
# keeps to itself. Eats flakes, bloodworms and pellets.
id = 8
name = "honey_gourami"
scientific_name = "Trichogaster chuna"
description = "A small honey-coloured fish that swims near the surface and gulps air."
palette = "fish/centrepiece"
zone = "surface"
depth = [0.0, 0.5]
bands = [3, 7]
min_depth = 20
# Real-world body length in cm (real 4–5 cm), at two cells per cm.
length_cm = 4.5
# A female is larger and deeper-bodied: about 5 cm (female_frames below).
female_length_cm = 5.0
# Lifespan and age at maturity in real days (4–6 years; mature at about 5
# months), on the life clock: a day per 10 world minutes (LIFE_DAY_SECONDS).
lifespan_days = 1825
maturity_days = 150
# Longest prey in cm: a hungry adult takes fry and shrimplets it
# touches (T9 part 2).
prey_cm = 1.2
breathes_air = true
# World seconds it lasts without air past a breath it misses (after a
# 45-second grace for the trip up, it then dies of suffocation). A labyrinth fish like the betta: its gills cover part of
# its needs, so it fades slowly without air. Fifteen minutes here.
air_tolerance_seconds = 900
temperament = "peaceful"
shy = true
speed = 2.5
max_speed = 6.0
diet = ["flake_food", "bloodworm", "brine_shrimp", "sinking_pellet"]

# Competing needs (#436): a shy, solitary fish weighs a meal against the
# plant cover it hides in. It has no social need: it doesn't school.
[needs]
hunger = 150
shelter = 120

# A bubble nester; eggs hatch in about a day.
# Broods are scaled down for a desktop tank; days are on the life clock.
[breeding]
mode = "eggs"
days = 1
brood = [6, 12]
rest_days = 14

[sprite]
# Facing right; two texels per cell side. 36x24 fine texels (9x6 cells):
# 4.5 cm from the tail fan to the snout.
# Traced from the owner's photo of a male in breeding colour: a deep
# golden oval highest behind the head, with a fine scale lattice, a
# highlight along the back and a faint speckled line along the flank; one
# long spiny dorsal from above the gill cover to the tail base, olive-grey
# spines with cream tips over an olive base band; a squared orange tail
# fan with rays; a long yellow anal fin with darker rays and cream tips; a
# charcoal-grey throat speckled with silver from the chin back under the
# gill cover; a red-orange flush behind the gold-ringed eye; and one long
# pale pelvic feeler. The fine frames are drawn first and the coarse frames
# traced from the same outline at half size. The female's keys follow
# below her frames' comment. Four frames: the tail sweeps, the dorsal
# and anal ripple and the feeler sways.

# A zebra otocinclus (Otocinclus cocama): a small creamy-ivory sucker-mouth
# catfish with bold dark charcoal-brown vertical bars, a warm peach throat, a
# tall sweeping dorsal fin and a deeply forked tail. It clings to the glass,
# plants and rock as a surface crawler, like the nerite, rasping off algae
# films and mulm as it goes.
id = 11
name = "otocinclus"
scientific_name = "Otocinclus vittatus"
description = "A small suckermouth catfish that grazes algae from surfaces."
palette = "fish/cleanup"
zone = "surfaces"
depth = [0.0, 1.0]
min_depth = 10
# Real-world body length in cm (real 3.5–4 cm), at two cells per cm.
length_cm = 3.5
# Lifespan and age at maturity in real days (3–5 years; mature at about 10
# months), on the life clock: a day per 10 world minutes (LIFE_DAY_SECONDS).
lifespan_days = 1460
maturity_days = 300
temperament = "peaceful"
speed = 3.0
max_speed = 3.0
# Would rather stay on the bottom, but lifts off for a short swim now and then.
swim_every = 30.0
diet = ["algae", "detritus", "algae_wafer"]

# Rarely spawns in a tank; eggs on leaves hatch in 2–3 days.
# Broods are scaled down for a desktop tank; days are on the life clock.
[breeding]
mode = "eggs"
days = 3
brood = [2, 6]
rest_days = 30

[sprite]
# Traced from the owner's zebra otocinclus (Otocinclus cocama) reference photo
# (straightened and flipped right), shaded in the house style: dark-shade
# outline, alternating ivory/charcoal zebra saddles, horizontal silvery side
# pectoral over a shaded belly, translucent olive-cream fins with explicit
# rays, and a compact dark eye with silver brow highlight. Facing right, belly
# and sucker mouth down; two texels per cell side (14x6 coarse, 28x12 fine).
# 7x3 cells (3.5 cm at two cells per cm), odd on both sides, so a quarter turn
# on the glass never leaves it on half cells. Four frames: the forked tail
# sweeps up and down, the dorsal flexes, and the ventral fins paddle.

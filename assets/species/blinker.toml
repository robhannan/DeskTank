# The blinker (placeholder art, D11): a fictional three-eyed mutant fish,
# an easter egg spawned by the cheat `radiation leak`. A grumpy, round,
# golden-orange mid-water swimmer whose three eyes blink out of step, and
# which glows a faint radioactive green at night. It lives like a
# goldfish: eats almost anything, grows big and is very messy.
id = 14
name = "blinker"
scientific_name = "Carassius auratus springfieldensis"
description = "A three-eyed mutant goldfish that glows after dark."
zone = "mid"
depth = [0.15, 0.9]
# Its body is 22 cells tall: it needs over twice that to turn and swim
# within its band.
min_depth = 48
# Real-world body length in cm, at two cells per cm (30 cells).
length_cm = 15.0
# Lifespan and age at maturity in real days (about 10 years; mature at a
# year), on the life clock.
lifespan_days = 3650
maturity_days = 365
temperament = "peaceful"
speed = 3.0
max_speed = 7.0
# Like a goldfish: every food, algae, mulm (detritus) and dead plant
# matter, plus corpses. Not live plant parts (grazing them is a
# follow-up), seeds, fertiliser or waste.
diet = ["flake_food", "sinking_pellet", "bloodworm", "brine_shrimp", "algae_wafer", "algae", "detritus", "dead_plant"]
eats_corpses = true
# A hungry blinker swallows fry, juvenile shrimp and Thai micro crabs;
# adult tetras, rasboras and shrimp are too big.
prey_cm = 1.5
# The heaviest bioload in the game: a dropping every 3 seconds.
waste_every = 3.0
# Added only by its cheat (SPEC §2.5): not in the palette, `spawn` or
# stocking, and it never breeds (a lone mutant).
cheat_only = true

# Night glow: an emissive green added after the night tint, so it shows in
# the dark and not by day, pulsing slowly. The eye whites glow more than
# the body, the pupils not at all; the outline glows most and a soft halo
# spills into the water.
[glow]
colour = "#7cff4f"
strength = 0.35
pulse = true
eyes = ["e", "E"]
unlit = ["k"]

[sprite]

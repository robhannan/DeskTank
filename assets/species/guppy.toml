# A guppy, Poecilia reticulata (placeholder art, D11), drawn as a male: a
# slim silver-grey body about 3 cm long with orange and blue patches and a
# black spot, and a large orange delta tail spotted with blue. An active
# swimmer of the middle and upper water that roams on its own rather than
# schooling. Eats flakes and bloodworms. Every guppy is a male for now:
# females (larger, plainer, short-tailed) and colour strains come with
# T9's per-individual size and colour genetics.
id = 9
name = "guppy"
zone = "mid"
depth = [0.1, 0.55]
min_depth = 20
# Real-world body length in cm without the tail (real males 1.5–3.5 cm),
# at two cells per cm.
length_cm = 3.0
# Lifespan and age at maturity in real days (about 2 years; mature at about
# 3 months), on the life clock: a day per 10 world minutes
# (LIFE_DAY_SECONDS).
lifespan_days = 730
maturity_days = 90
breathes_air = false
temperament = "peaceful"
speed = 4.5
max_speed = 9.0
diet = ["flake_food", "bloodworm"]


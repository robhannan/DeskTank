# A guppy, Poecilia reticulata. The male has a slim 3 cm body — iridescent
# silver-aqua in front, deep royal blue behind with a turquoise starburst at
# the peduncle — and a sweeping spotted dorsal fin and large orange mosaic
# delta tail; the female is plainer and deeper with a small tail. An active
# swimmer of the middle and upper water that roams on its own rather than
# schooling. Eats flakes and bloodworms, and fry.
id = 9
name = "guppy"
palette = "fish/schooling"
zone = "mid"
depth = [0.1, 0.55]
min_depth = 20
# Real-world body length in cm without the tail (real males 1.5–3.5 cm),
# at two cells per cm.
length_cm = 3.0
# A female is larger and deeper: about 4.5 cm without her small tail
# (female_frames below).
female_length_cm = 4.5
# Lifespan and age at maturity in real days (about 2 years; mature at about
# 3 months), on the life clock: a day per 10 world minutes
# (LIFE_DAY_SECONDS).
lifespan_days = 730
maturity_days = 90
# Longest prey in cm: guppies eat fry, their own included (a newborn
# female is a third of her 4.5 cm), and shrimplets (T9 part 2).
prey_cm = 1.6
breathes_air = false
temperament = "peaceful"
speed = 4.5
max_speed = 9.0
diet = ["flake_food", "bloodworm", "floating_leaf"]

# A livebearer: about 4 weeks' gestation (real broods of 20–50 fry).
# Broods are scaled down for a desktop tank; days are on the life clock.
[breeding]
mode = "livebearer"
days = 28
brood = [3, 8]
rest_days = 7

# Colour strains (SPEC §2.4, D13), in allele order (append only: saves
# keep the index). The sprite is the wild type: iridescent silver-aqua front,
# royal-blue rear body and an orange-and-black mosaic tail with a pale cream
# rim; the fancy strains recolour the tail and dorsal fin, and crossing them
# reverts to wild. A morph's colours replace the sprite's by key.
[genetics]
wildtype = "wild"
sprite = "wild"

[[genetics.morph]]
name = "wild"

[[genetics.morph]]
name = "red"
colours = { o = "#ff4a2c", t = "#d81e2a", y = "#ff664a", c = "#941428", r = "#a61220", h = "#eea49a" }

[[genetics.morph]]
name = "blue"
colours = { o = "#4a92f6", t = "#2a6ae0", y = "#7cb8ff", c = "#1a3a9a", r = "#1d4bb8", h = "#b8d6f6" }

[sprite]
# Facing right; two texels per cell side. A fancy mosaic male traced from
# the owner's photo (rotated +5.5 degrees clockwise to swim level) and shaded
# in the house style: a 6-cell (3 cm) body — metallic silver-aqua in front
# with a scale lattice, gill cover and pale belly, transitioning to a royal
# cobalt tuxedo rear and turquoise-ice peduncle starburst — a sweeping
# leopard-spotted dorsal fin, a pale ventral/gonopodium fin, and a 3-cell
# (1.5 cm) rounded orange-and-black mosaic delta tail with a pale cream outer
# margin. A 9x5-cell sprite (18x10 coarse texels), 4.5 cm with the tail. Four
# frames: the tail sweeps and flexes, and the dorsal and gonopodium ripple.

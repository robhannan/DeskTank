# A guppy, Poecilia reticulata (placeholder art, D11). The male has a slim
# silver-grey body about 3 cm long with orange and blue patches and a black
# spot, and a large orange delta tail spotted with blue; the female is
# plainer and deeper with a small tail. An active swimmer of the middle and
# upper water that roams on its own rather than schooling. Eats flakes and
# bloodworms, and fry.
id = 9
name = "guppy"
scientific_name = "Poecilia reticulata"
description = "A small livebearing fish whose males sport bright fan tails."
palette = "fish/schooling"
zone = "mid"
depth = [0.1, 0.55]
min_depth = 20
# Real-world body length in cm without the tail (real males 1.5–3.5 cm),
# at two cells per cm.
length_cm = 3.0
# A female is larger and deeper: about 4.5 cm without her small tail
# (female_frames below).
female_length_cm = 4.5
# Lifespan and age at maturity in real days (about 2 years; mature at about
# 3 months), on the life clock: a day per 10 world minutes
# (LIFE_DAY_SECONDS).
lifespan_days = 730
maturity_days = 90
# Longest prey in cm: guppies eat fry, their own included (a newborn
# female is a third of her 4.5 cm), and shrimplets (T9 part 2).
prey_cm = 1.6
breathes_air = false
temperament = "peaceful"
speed = 4.5
max_speed = 9.0
diet = ["flake_food", "bloodworm", "floating_leaf"]

# A livebearer: about 4 weeks' gestation (real broods of 20–50 fry).
# Broods are scaled down for a desktop tank; days are on the life clock.
[breeding]
mode = "livebearer"
days = 28
brood = [3, 8]
rest_days = 7

# Colour strains (SPEC §2.4, D13), in allele order (append only: saves
# keep the index). The sprite is the wild type: orange and blue patches and
# an orange tail; the fancy strains recolour the tail and patches, and
# crossing them reverts to wild. A morph's colours replace the sprite's by
# key.
[genetics]
wildtype = "wild"
sprite = "wild"

[[genetics.morph]]
name = "wild"

[[genetics.morph]]
name = "red"
colours = { o = "#ff4a2c", t = "#d81e2a", y = "#ff5a3a", c = "#a81020", r = "#b81422", h = "#ff7a5a" }

[[genetics.morph]]
name = "blue"
colours = { o = "#4a8af0", t = "#2f6ee0", y = "#7fb0ff", c = "#1a3a9a", r = "#2458c0", h = "#9cc4ff" }

[sprite]

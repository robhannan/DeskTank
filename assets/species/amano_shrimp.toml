# An amano shrimp, Caridina multidentata (placeholder art, D11): a larger
# translucent tan shrimp, 3–5 cm long (drawn at 4 cm), with dashed brown
# lines and dots along its side. A tireless algae grazer and a bold scavenger: it
# takes every prepared food as well as algae and mulm, and darts after it
# faster than the cherries.
id = 6
name = "amano_shrimp"
zone = "bottom"
depth = [0.68, 1.0]
min_depth = 14
# Real-world body length in cm, nose to tail without the antennae.
length_cm = 4.0
# Lifespan and age at maturity in real days (2–3 years; mature at about 5
# months), on the life clock: a day per 10 world minutes (LIFE_DAY_SECONDS).
lifespan_days = 1095
maturity_days = 150
temperament = "peaceful"
speed = 2.5
max_speed = 8.0
# Would rather stay on the bottom, but lifts off for a short swim now and then.
swim_every = 24.0
hop_every = 10.0
diet = ["algae", "detritus", "algae_wafer", "sinking_pellet", "bloodworm", "flake_food"]

# Doesn't breed here: its larvae need brackish water.

[sprite]
# Facing right; two texels per cell side. The body is 16 texels (8 cells,
# 4 cm at two cells per cm) from tail fan to rostrum; the long antennae
# sweep 4 texels past it, one down to the ground: a 10x3-cell sprite.
# Traced from a side-on photo: longer and slimmer than the cherry, a
# straight back with a gentle hump where carapace meets abdomen, a long
# rostrum, a narrow tail fan, long jointed legs, and one antenna swept
# back along the flank and past the tail. Translucent tan, outlined in a
# dark shade of it, with the dot-dash markings. Four frames: the legs
# step while the tail fan and antennae flick.

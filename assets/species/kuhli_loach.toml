id = 21
name = "kuhli_loach"
scientific_name = "Pangio kuhlii"
description = "A slender, banded loach that burrows into loose substrate and forages at night."
palette = "fish/cleanup"
zone = "bottom"
depth = [0.72, 1.0]
# Nocturnal: it stays up through the night (SPEC §2.4).
rests = "never"
min_depth = 12
length_cm = 10.0
lifespan_days = 2920
maturity_days = 540
temperament = "peaceful"
speed = 4.0
max_speed = 12.0
# Would rather stay on the bottom, but lifts off for a short swim now and then.
swim_every = 50.0
# Digs into sand, gravel or soil (never rock) now and then and comes back out.
burrow_every = 45.0
diet = ["sinking_pellet", "bloodworm"]


[breeding]
mode = "eggs"
days = 3
brood = [3, 8]
rest_days = 28


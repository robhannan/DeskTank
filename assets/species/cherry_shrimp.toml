# A cherry shrimp, Neocaridina davidi (placeholder art, D11): a small red
# shrimp 1.5–4 cm long that picks over the substrate for algae, mulm and
# fallen food, and kicks off the bottom in short hops now and then. The male
# is smaller, slim and paler (drawn at 2.5 cm); the female is larger, deeper in
# the abdomen and solid red (3 cm), and carries her eggs yellow-orange under
# her tail when berried.
id = 5
name = "cherry_shrimp"
scientific_name = "Neocaridina davidi"
description = "A small, colourful shrimp that picks over the bottom and makes short hops."
palette = "invertebrates/shrimp"
zone = "bottom"
depth = [0.72, 1.0]
min_depth = 12
# Real-world body length in cm, nose to tail without the antennae; the
# sprite is drawn at two cells per cm. A male is about 2.5 cm.
length_cm = 2.5
# A female is larger: about 3 cm (female_frames below).
female_length_cm = 3.0
# Lifespan and age at maturity in real days (1–2 years; mature at 2–3
# months), on the life clock: a day per 10 world minutes (LIFE_DAY_SECONDS).
lifespan_days = 550
maturity_days = 75
temperament = "peaceful"
speed = 2.0
max_speed = 6.0
# Would rather stay on the bottom, but lifts off for a short swim now and then.
swim_every = 30.0
# Seconds between hops: it pushes off and drifts back down a few cells away.
hop_every = 6.0
diet = ["algae", "detritus", "algae_wafer", "sinking_pellet", "flake_food"]

# The female carries her eggs under her tail ("berried", carrying_frames
# below) for about 30 days and releases tiny shrimplets (real broods of
# 20–30). Broods are scaled down for a desktop tank; days are on the life
# clock.
[breeding]
mode = "livebearer"
days = 30
brood = [3, 8]
rest_days = 7

# Colour morphs (SPEC §2.4, D13), in allele order (append only: saves keep
# the index). The sprite is drawn in red, the cherry the palette adds; wild
# Neocaridina are brown and clear, and mixed colours revert to it. A
# morph's colours replace the sprite's by key.
[genetics]
wildtype = "wild"
sprite = "red"

[[genetics.morph]]
name = "red"

[[genetics.morph]]
name = "wild"
colours = { r = "#6e5a44", h = "#9a8670", d = "#4a3a2c", a = "#a8968a", l = "#5e4c3a", m = "#3a2c20", s = "#7e6850", w = "#d8ccbc" }

[[genetics.morph]]
name = "blue"
colours = { r = "#2a4fa8", h = "#5c84d8", d = "#1a3270", a = "#7a9ad8", l = "#22408a", m = "#12224e", s = "#3a62c0", w = "#cce0ff" }

[[genetics.morph]]
name = "yellow"
colours = { r = "#e0b020", h = "#f4d660", d = "#a87a10", a = "#f0d070", l = "#c49418", m = "#7a5408", s = "#eac23a", w = "#fff4cc" }

[sprite]
# Facing right; two texels per cell side. The male: 2.5 cm from tail fan
# to rostrum, with the antennae past it: a 6x2-cell sprite (24x8 fine
# texels). Traced from the owner's "Sexing Shrimp" chart: an almost
# straight, triangular profile, smaller and paler than the female, the
# carapace rising to the rostrum behind the eye, the abdomen tapering to a
# thin tail fan, with walking legs that touch the sprite's bottom row and
# swimmerets under the abdomen. Outlined in a dark shade of the body, never
# black. Four frames: the legs step while the tail fan and antennae flick.
# Eggs use their own colour keys (y, u, z) that no morph recolours.

# A cherry shrimp, Neocaridina davidi (placeholder art, D11): a small red
# shrimp about 2.5 cm long that picks over the substrate for algae, mulm
# and fallen food, and kicks off the bottom in short hops now and then.
id = 5
name = "cherry_shrimp"
zone = "bottom"
depth = [0.72, 1.0]
min_depth = 12
temperament = "peaceful"
speed = 2.0
max_speed = 6.0
# Seconds between hops: it pushes off and drifts back down a few cells away.
hop_every = 6.0
diet = ["algae", "detritus", "algae_wafer", "sinking_pellet", "flake_food"]


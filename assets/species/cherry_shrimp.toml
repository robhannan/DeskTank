# A cherry shrimp, Neocaridina davidi (placeholder art, D11): a small red
# shrimp 1.5–4 cm long (males small and slim, females larger and solid
# red; drawn at a typical 2.5 cm) that picks over the substrate for algae, mulm
# and fallen food, and kicks off the bottom in short hops now and then.
id = 5
name = "cherry_shrimp"
zone = "bottom"
depth = [0.72, 1.0]
min_depth = 12
# Real-world body length in cm, nose to tail without the antennae; the
# sprite is drawn at two cells per cm.
length_cm = 2.5
# Lifespan and age at maturity in real days (1–2 years; mature at 2–3
# months), on the life clock: a day per 10 world minutes (LIFE_DAY_SECONDS).
lifespan_days = 550
maturity_days = 75
temperament = "peaceful"
speed = 2.0
max_speed = 6.0
# Seconds between hops: it pushes off and drifts back down a few cells away.
hop_every = 6.0
diet = ["algae", "detritus", "algae_wafer", "sinking_pellet", "flake_food"]

[sprite]
# Facing right; two texels per cell side. The body is 10 texels (5 cells,
# 2.5 cm at two cells per cm) from tail fan to eye, with the antennae
# reaching 2 texels past it: a 6x2-cell sprite. Four frames: the legs
# paddle while the tail fan and antennae flick.

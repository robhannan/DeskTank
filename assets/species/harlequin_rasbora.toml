# A harlequin rasbora, Trigonostigma heteromorpha: a
# deep-bodied copper-orange schooling fish with a black triangular wedge on
# its rear half, pointing to the tail. Schools with its own kind in mid
# water (not with the neons) and takes flakes and bloodworms.
id = 10
name = "harlequin_rasbora"
scientific_name = "Trigonostigma heteromorpha"
description = "A coppery schooling fish with a bold black wedge near its tail."
palette = "fish/schooling"
zone = "mid"
depth = [0.3, 0.7]
min_depth = 24
# Real-world body length in cm (real 4–4.5 cm), at two cells per cm.
length_cm = 4.5
# Lifespan and age at maturity in real days (5–6 years; mature at about 7
# months), on the life clock: a day per 10 world minutes (LIFE_DAY_SECONDS).
lifespan_days = 1825
maturity_days = 210
breathes_air = false
temperament = "schooling"
speed = 4.5
max_speed = 9.0
diet = ["flake_food", "bloodworm"]

# Lays its eggs under broad leaves; they hatch in about a day.
# Broods are scaled down for a desktop tank; days are on the life clock.
[breeding]
mode = "eggs"
days = 1
brood = [4, 10]
rest_days = 14

[sprite]
# Facing right; two texels per cell side. 18 texels (9 cells, 4.5 cm)
# from the forked tail to the snout and 10 deep (an 18x10 sprite), traced
# from the owner's side-on photo (mirrored): a deep copper body with a
# rosy cheek and pale belly, the black wedge from below the dorsal fin
# tapering to the tail root with a gold rim at its front, and red-edged
# dorsal, anal, pelvic and forked tail fins. Four frames: the tail lobes
# sweep and lift, the other fins ripple.

[sprite]
# Facing right; two texels per cell side. A halfmoon male traced from a
# photo: a 12-cell (6 cm) body with the betta's scowl and upturned mouth,
# rosy with a silvery scale lattice, a pale pectoral and a dark belly. Its
# finnage, in a relaxed spread, joins into one drape behind and below it:
# a dorsal sweeping back with a blue leading edge, a broad caudal fan and
# a deep anal fin, with darker branching rays, lighter streaks and folds,
# a darker frayed rim and teal and blue iridescence near the tips. The
# two pelvic fins hang from the throat, apart: the near one forward to a
# white tip, the far one darker, straight down across the anal fin. A 20x16-cell
# sprite, outlined in dark shades of each part's colour. Four frames: the
# fins sway and ripple.
#
# Zone keys let morphs pattern it: on the body R H S D N (patch A) and
# 1 2 3 4 5 (patch B) stand for r h s d n; on the fins F G V M (patch A),
# 6 7 8 9 (patch B) and W X Y Z (the outer edge band) stand for f g v m.
# The red colours them all alike.

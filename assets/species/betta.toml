colours = { e = "#ffffff", r = "#c49361", h = "#e8ba8a", s = "#f0cca7", d = "#9a734b", S = "#a87e52", o = "#6e5235", m = "#926e48", n = "#664c31", v = "#b0885e", q = "#d4a778", O = "#4a3722", p = "#e8bd90", a = "#ffddba" }


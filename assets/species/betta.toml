# A betta: a labyrinth fish that keeps near the
# surface and gulps air there. Eats flakes, bloodworms and pellets.
id = 3
name = "betta"
palette = "fish/centrepiece"
zone = "surface"
depth = [0.0, 0.3]
# Water twice as deep as its finnage is tall.
min_depth = 32
# Real-world body length in cm, at two cells per cm: a male Betta
# splendens is about 6 cm without its fins, the largest of the small
# community fish. Its halfmoon fins take the sprite to 10 cm.
length_cm = 6.0
# Lifespan and age at maturity in real days (about 3 years; mature at 3–4
# months), on the life clock: a day per 10 world minutes (LIFE_DAY_SECONDS).
lifespan_days = 1095
maturity_days = 120
# Longest prey in cm: a hungry adult takes fry, shrimp and crabs it
# touches (T9 part 2).
prey_cm = 2.5
breathes_air = true
# World seconds it lasts without air past a breath it misses (after a
# 45-second grace for the trip up, it then dies of suffocation). A labyrinth fish: it must gulp air to thrive, but its gills
# still take some oxygen from the water, so kept from the surface it
# weakens over hours, not minutes. Fifteen minutes here, several times a
# frog's.
air_tolerance_seconds = 900
temperament = "territorial"
# Radius in cm of the territory an adult claims where it settles: it
# patrols it and drives other fish out (and other males of its own kind).
territory_cm = 15.0
speed = 3.5
max_speed = 8.0
diet = ["flake_food", "bloodworm", "sinking_pellet"]

# The male guards a bubble nest; eggs hatch in 1–2 days.
# Broods are scaled down for a desktop tank; days are on the life clock.
[breeding]
mode = "eggs"
days = 2
brood = [6, 12]
rest_days = 14

[genetics]
cycle_palette = true
wildtype = "wild"
sprite = "wild"


# Tiger lotus (Nymphaea zenkeri): a bulb in the substrate putting up broad,
# arrowhead-to-round leaves mottled red and green on long petioles of
# differing lengths. The longest reach the surface, where the leaves lie
# flat on the water as floating pads that shade the tank below. A fast,
# hungry root feeder that wants fairly bright light; it spreads by runners
# and reddens further in strong light with lean water.
id = 18
name = "tiger_lotus"
description = "Mottled red leaves on long stalks from a bulb; some float."
form = "rosette"
propagation = ["runners"]

# Crown (bulb) cells; petioles (≤ crown + 2) and the longest's length;
# cells between outward steps; root depth; runner cells to a new plant;
# substrates; cells each leaf pad spreads to either side of its petiole.
[rosette]
crown = 2
blades = 4
blade_length = 56
lean = 14
root_depth = 10
spacing = 16
substrates = ["sand", "gravel", "aquasoil"]
pad = 4

[prefer]
light = { min = 0.15, optimum = 0.75, max = 1.8 }
nutrient = { min = 0.05, optimum = 0.5, max = 3.5 }
co2 = { min = -1.0, optimum = 1.0, max = 4.0 }

[growth]
rate = 36.0
size = 300
cost = 0.012
root_feeder = true

[hardiness]
tolerance = 25.0
decline = 0.01
recovery = 0.02

# A brown bulb and pale roots; the leaf ramp runs from maroon blotches
# through bronze to the green the leaves are mottled over.
[colours]
root = ["#9c8a62", "#b9a77c", "#d6c79c"]
stem = ["#4a3020", "#5c3c26", "#704a2e"]
leaf = ["#3e1418", "#5e1e22", "#80302c", "#8c5232", "#5c6a2a", "#6e8232", "#86983c", "#9eae4c"]

[look]
leaf = "lotus"
stem = "thick"
root = "thick"

[colouration]
colour = "#b8323c"
light = 1.0
nutrient = 0.8

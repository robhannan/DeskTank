# Java moss (T6's moss): a mat that creeps over rock and driftwood. Each
# cell must touch one, or it falls off as dead plant matter. It needs
# little light and grows slowly even without nutrients.
id = 2
name = "java_moss"
scientific_name = "Taxiphyllum barbieri"
palette = "plants/moss"
description = "A slow, hardy moss that creeps over rock and wood."
form = "mat"
propagation = ["fragments"]

[mat]
on = ["rock", "driftwood"]

[prefer]
light = { min = 0.01, optimum = 0.3, max = 1.5 }
nutrient = { min = -0.3, optimum = 0.3, max = 3.0 }
co2 = { min = -1.0, optimum = 1.0, max = 4.0 }

[growth]
rate = 8.0
size = 600
cost = 0.005

[hardiness]
tolerance = 30.0
decline = 0.01
recovery = 0.02

# A dark mat with lighter growing tips at its fringe.
[colours]
root = ["#3a4a2a"]
stem = ["#1b3d19", "#234f20", "#2f6b2a", "#3c8034", "#4f9645"]
leaf = ["#2f6b2a", "#3c8034", "#4a9440"]

# A soft, fuzzy mat.
[look]
stem = "fuzz"

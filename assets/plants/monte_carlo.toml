# Monte Carlo (Micranthemum tweediei): a dense carpet of tiny, round,
# bright green leaves on short creeping stems. It needs strong light and
# carpets far better with CO₂.
id = 11
name = "monte_carlo"
description = "A dense carpet of tiny round leaves for strong light."
form = "carpet"
propagation = ["runners", "fragments"]

[carpet]
blades = 3
blade_length = 2
lean = 0
root_depth = 3
spacing = 3
substrates = ["sand", "gravel", "aquasoil"]

[prefer]
light = { min = 0.12, optimum = 0.75, max = 2.0 }
nutrient = { min = 0.05, optimum = 0.5, max = 3.0 }
co2 = { min = -0.6, optimum = 1.3, max = 4.0 }

[growth]
rate = 18.0
size = 22
cost = 0.006

[hardiness]
tolerance = 15.0
decline = 0.012
recovery = 0.02

# Vivid light green pads.
[colours]
root = ["#b0a27e", "#cbbf98"]
stem = ["#3f7a2a", "#4d9032"]
leaf = ["#3c8a2c", "#4ba035", "#5db641", "#73c950", "#8fd966", "#aee784"]

[look]
leaf = "pad"
stem = "thick"
root = "strand"

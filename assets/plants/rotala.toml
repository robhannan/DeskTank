# Rotala: a stem plant for strong light. It outgrows hygrophila near the
# surface and struggles in shade. Cut pieces don't regrow.
id = 3
name = "rotala"
scientific_name = "Rotala rotundifolia"
palette = "plants/stem"
description = "A fine-leaved stem plant that needs strong light."
form = "stem"
propagation = ["cuttings"]

[stem]
height = 48
internode = 2
leaf_length = 3
root_depth = 8
branching = 0.2
substrates = ["sand", "gravel", "aquasoil", "clown_vomit_gravel"]

[prefer]
light = { min = 0.25, optimum = 1.0, max = 1.6 }
nutrient = { min = 0.05, optimum = 0.4, max = 3.0 }
co2 = { min = -1.0, optimum = 1.2, max = 4.0 }

[growth]
rate = 45.0
size = 260
cost = 0.01

[hardiness]
tolerance = 15.0
decline = 0.012
recovery = 0.02

# Green low down to a bright yellow-green at the tips. In strong light
# with lean water its new growth turns pink-red ([colouration]).
[colours]
root = ["#a89c74", "#c9bd94", "#e4dbb8"]
stem = ["#5a4a26", "#6a5a2c", "#7e6a34", "#94803e"]
leaf = ["#4f6e2a", "#5f8030", "#739438", "#8aa842", "#a2bc4e", "#b8cc62"]

# Fine, narrow leaves on a thin stalk.
[look]
leaf = "needle"
stem = "stalk"
root = "strand"

# Strong light (above 0.65) with lean water (nutrient below 0.8, fully at
# 0.4, so an aquasoil tank's level) turns it pink-red, the tips most.
[colouration]
colour = "#e0566a"
light = 0.65
nutrient = 0.8
